name: Deploy KimiMint and NFT backend

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "contracts/nft/**"
      - "scripts/verify-kiminft.cjs"
      - "scripts/prepare-full-verify.mjs"
      - "package.json"
      - "package-lock.json"
      - "deployments/bsc-KimiNFTLaunchFactory.json"
      - ".github/workflows/deploy-kimimint-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KIMI_BACKEND_SSH_KEY }}

      - name: Trust server host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.KIMI_BACKEND_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload backend source
        env:
          HOST: ${{ secrets.KIMI_BACKEND_HOST }}
          USER: ${{ secrets.KIMI_BACKEND_USER }}
          PATH_ON_SERVER: ${{ secrets.KIMI_BACKEND_PATH }}
        run: |
          tar --exclude=node_modules --exclude=dist --exclude=.git --exclude=work -czf /tmp/kimi-backend.tgz server contracts/nft scripts package.json package-lock.json deployments hardhat.config.cjs
          scp /tmp/kimi-backend.tgz "$USER@$HOST:/tmp/kimi-backend.tgz"
          ssh "$USER@$HOST" "mkdir -p '$PATH_ON_SERVER' && tar -xzf /tmp/kimi-backend.tgz -C '$PATH_ON_SERVER' && rm -f /tmp/kimi-backend.tgz"

      - name: Install and restart backend
        env:
          HOST: ${{ secrets.KIMI_BACKEND_HOST }}
          USER: ${{ secrets.KIMI_BACKEND_USER }}
          PATH_ON_SERVER: ${{ secrets.KIMI_BACKEND_PATH }}
        run: |
          ssh "$USER@$HOST" "cd '$PATH_ON_SERVER' && npm ci && npm run contracts:compile"
          ssh "$USER@$HOST" "cd '$PATH_ON_SERVER' && touch .env && sed -i '/^KIMIMINT_FACTORY_ADDRESS=/d;/^KIMINFT_FACTORY_ADDRESS=/d;/^AUTO_VERIFY_PROJECTS=/d;/^KIMIMINT_RPC_URL=/d;/^BSCSCAN_API_KEY=/d' .env && printf '%s\\n' 'KIMIMINT_FACTORY_ADDRESS=${{ secrets.KIMIMINT_FACTORY_ADDRESS }}' 'KIMINFT_FACTORY_ADDRESS=${{ secrets.KIMINFT_FACTORY_ADDRESS }}' 'AUTO_VERIFY_PROJECTS=true' 'KIMIMINT_RPC_URL=${{ secrets.KIMIMINT_RPC_URL }}' 'BSCSCAN_API_KEY=${{ secrets.BSCSCAN_API_KEY }}' >> .env"
          ssh "$USER@$HOST" "if command -v pm2 >/dev/null 2>&1; then pm2 restart kimi-backend --update-env || pm2 start server/kimimint-backend.mjs --name kimi-backend; pm2 save; else pkill -f 'server/kimimint-backend.mjs' || true; nohup node server/kimimint-backend.mjs > kimi-backend.log 2>&1 </dev/null & fi"

      - name: Verify health endpoint
        env:
          HEALTH_URL: ${{ secrets.KIMI_BACKEND_HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL"
          for attempt in 1 2 3 4 5; do
            body=$(curl --fail --silent --show-error "$HEALTH_URL") && echo "$body" && echo "$body" | grep -q 'nftFactory' && exit 0
            sleep 10
          done
          exit 1
