name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-function.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Supabase Edge Functions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          RATE_LIMIT_PER_MINUTE: ${{ secrets.RATE_LIMIT_PER_MINUTE }}
        run: |
          supabase link --project-ref "$PROJECT_ID"
          supabase secrets set --project-ref "$PROJECT_ID" \
            OPENAI_IMAGE_API_KEY="$OPENAI_IMAGE_API_KEY" \
            DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" \
            ALLOWED_ORIGINS="$ALLOWED_ORIGINS" \
            RATE_LIMIT_PER_MINUTE="$RATE_LIMIT_PER_MINUTE"
          supabase functions deploy generate-image --project-ref "$PROJECT_ID"
          supabase functions deploy deepseek-chat --project-ref "$PROJECT_ID"
